<!DOCTYPE html>
<html>
<head>
<script type="text/html" id='post-likes'>
	<div class="sd-content wpl-likebox">
		<% if ( canReblog && canUserReblog ) { %>
		<div class="wpl-button reblog">
			<a href="master.html@ver=20251112.html#" title='<%- reblog_feedback_no_html %>' class='<%- reblog_css_state %> sd-button' rel='nofollow'>
				<span><%= reblog_label %></span>
			</a>
		</div>
		<% } %>
		<% if ( canLike ) { %>
		<div class="wpl-button <%- css_state %>">
			<a href="master.html@ver=20251112.html#" title='<%- feedback_no_html %>' class='<%- css_state %> sd-button' rel='nofollow'>
				<span><%= label %></span>
			</a>
		</div>

		<% if ( hasLikes ) { %>
		<ul class="wpl-avatars sd-like-gravatars">
			<% likers.forEach( function( item, key ) { %>
				<li class='<%- item.css_class %>' data-liker-id="<%- item.ID %>"><a href="https://widgets.wp.com/likes/&lt;%=&#32;item.profile_URL&#32;%&gt;" title="<%- item.name %>" class="wpl-liker" rel="nofollow" target="_parent">
					<img src='https://widgets.wp.com/likes/&lt;%=&#32;item.avatar_URL&#32;%&gt;' class='avatar avatar-30' alt='<%- item.name %>' width='30' height='30' />
				</a></li>
			<% }); %>
		</ul>
		<% } %>
		<div class="wpl-count sd-like-count">
			<%= feedback %>
		</div>
		<% } %>
	</div>
</script>

<script type="text/html" id='slim-likes'>
	<div class="sd-content wpl-likebox wpl-slim-likebox">
		<div class="wpl-button <%- css_state %>">
			<a href="master.html@ver=20251112.html#" title='<%- feedback_no_html %>' class='<%- css_state %> sd-button' rel='nofollow'>
				<span><%= label %></span>
			</a>
		</div>

		<div class="wpl-count sd-like-count">
			<%= feedback %>
		</div>
	</div>
</script>

<script type="text/html" id='comment-likes'>
	<div class="wpl-likebox">
		<div id="comment-like" class="comment-likes <%- css_state %>">
			<a href="master.html@ver=20251112.html#" class="comment-like-link" rel="nofollow"><%= label %></a>
		</div>
	</div>
</script>

<script type="text/javascript" src="../../../../s0.wp.com/wp-content/js/rlt-proxy.js@m=20240709"></script>
<script type="text/javascript" src="../../../../s0.wp.com/_static/index.html@%253F%252Fwp-content%252Fjs%252Ftannin%252Fcompat.min.js,%252Fwp-content%252Fjs%252Fwpcom-proxy-request.js,%252Fwp-content%252Fjs%252Flikes-rest-nojquery.js%253Fm=20250324"></script>

<script type="text/javascript">
	// compute origin from URL argument
	var parentOrigin;
	if (window.location.hash) {
		var params = (window.location.hash.substr(1)).split("&");

		for (i = 0; i < params.length; i++) {
			var a = params[i].split("=");
			// Now every parameter from the hash is beind handled this way
			if (a[0] == "origin") {
				parentOrigin = a[1];
			}
		}
	}
	rltInitialize( { rlt: null, iframeOrigins: ['https://public-api.wordpress.com'], parentOrigin: parentOrigin } );
</script>
</head>
<body></body>
</html>
