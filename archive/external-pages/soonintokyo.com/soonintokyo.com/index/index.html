 concerts, and activities that aim to vindicate the power of words and poetry. Through the title \u201c+ POESIA SI US PLAU\u201d (more poetry please), the festival claims a vindictive and transgressive vision of society. A slogan that demands for more poetry in the world.<\/p>","format":null,"externalUrl":null,"contents":[]},{"title":"PERFECT NEVER CALENDAR. REEBOK","id":"164","slug":"reebok-calendario","type":"post","orientation":1.3333333333333333,"verticalFlow":null,"project":{"title":"Reebok Calendar","id":"22","uid":"0dddd080-8561-4d69-9b59-f6b49017819f","slug":"reebok-calendar"},"media":[{"id":"156","title":"Calendario1","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/calendario1.gif","width":"2000","height":"1500","type":"image","video":null},{"id":"160","title":"Calendario5","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/calendario5.gif","width":"2000","height":"1500","type":"image","video":null},{"id":"162","title":"Calendario7","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/calendario7.gif","width":"2000","height":"1500","type":"image","video":null},{"id":"161","title":"Calendario6","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/calendario6.gif","width":"2000","height":"1500","type":"image","video":null},{"id":"159","title":"Calendario4","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/calendario4.gif","width":"2000","height":"1500","type":"image","video":null},{"id":"775","title":"Reebok Calendario Soon In Tokyo 01","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/reebok-calendario-soon-in-tokyo-01.jpg","width":"2001","height":"1501","type":"image","video":null},{"id":"781","title":"Reebok Calendario Soon In Tokyo 02","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/reebok-calendario-soon-in-tokyo-02.jpg","width":"2001","height":"1501","type":"image","video":null},{"id":"780","title":"Reebok Calendario Soon In Tokyo 03","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/reebok-calendario-soon-in-tokyo-03.jpg"," The Picasso Museum held an exhibition with the most recognizable portraits made by Pablo Picasso to his friends, lovers ,and family, in the form of paintings, drawings, objects, and sculptures. The visual identity proposed a dialogue between Picasso\u2019s portraits and photographs. The campaign consisted of communications, signage, printed, and digital.<\/p>","format":null,"externalUrl":null,"contents":[]},{"title":"DISCOVER STREET PLAY. BOBOLI","id":"50","slug":"boboli","type":"post","orientation":1.3333333333333333,"verticalFlow":null,"project":{"title":"Boboli","id":"49","uid":"f979424f-c78e-47b0-860b-2b854df66cf3","slug":"boboli"},"media":[{"id":"985","title":"Street1","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/street1.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"1244","title":"Soon In Tokyo Boboli Street Play 1","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/soon_in_tokyo_boboli_street_play_1.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"987","title":"Street3","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/street3.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"1245","title":"Soon In Tokyo Boboli Street Play 2","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/soon_in_tokyo_boboli_street_play_2.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"989","title":"Street5","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/street5.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"425","title":"Boboli Street Play Aw17","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/BOBOLI-STREET-PLAY-AW17.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"310","title":"Boboli Street Cover","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/BOBOLI-STREET-COVER.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"1246","title":"Soon In Tokyo Boboli Street Play 3","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/soon_in_tokyo_boboli_street_play_3.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"315","title":"Boboli Street 38","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/BOBOLI-STREET-38.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"313","title":"Boboli Street 20","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/BOBOLI-STREET-20.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"314","title":"Boboli Street 34","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/BOBOLI-STREET-34.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"1247","title":"Soon In Tokyo Boboli Street Play 4","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/soon_in_tokyo_boboli_street_play_4.jpg","width":"2000","height":"1500","type":"image","video":null}],"text":"<p>There is life beyond the screen, and an urgent need for kids to TAKE BACK THE STREETS. Integrated campaign, strategy, and content for different medias that builds upon the umbrella tagline \u201cDiscover the World with Boboli\u201d. All the executions, channels and touching points serve both as tools and inspiration to encourage parents and kids to learn more about the certain subject. Since 2016 we have been building a long term concept, with the campaign changing subject matter with the release of each new season for Boboli, a children's fashion brand with a presence in over 50 countries.<\/p>","format":null,"externalUrl":null,"contents":[]},{"title":"25 YEARS OF FLOW. REEBOK CLASSIC","id":"756","slug":"reebok-25-a\u00f1os-flow-postal","type":"post","orientation":1.3333333333333333,"verticalFlow":null,"project":{"title":"Reebok Calendar","id":"22","uid":"0dddd080-8561-4d69-9b59-f6b49017819f","slug":"reebok-calendar"},"media":[{"id":"751","title":"Reebok Libro 1","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/reebok_libro_1.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"7 ol\u00f3viev, H\u00e9ctor Merienda, Alfonso Casas, David Buis\u00e1n, Sergi Delgado, Martina Matencio, Pati Gagarin, Adriana Roslin, Alfonso Casas, John Philip Sage and Manuel Cruzcastillo.<\/p>","format":null,"externalUrl":null,"contents":[]},{"title":"POESIA I + 2017","id":"38","slug":"poesia","type":"post","orientation":1.3333333333333333,"verticalFlow":null,"project":{"title":"+ Poesia","id":"37","uid":"a982971e-05a7-46f3-860d-2a5f26c83fc1","slug":"poesia"},"media":[{"id":"239","title":"Poesia Bandera 1","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-1.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"240","title":"Poesia Bandera 2","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-2.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"241","title":"Poesia Bandera 3","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-3.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"242","title":"Poesia Bandera 4","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-4.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"243","title":"Poesia Bandera 5","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-5.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"245","title":"Poesia Bandera 7","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-7.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"244","title":"Poesia Bandera 6","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-6.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"247","title":"Poesia Bandera 9","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-9.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"556","title":"Poesia Desnudo Poster4","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/poesia_desnudo_poster4.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"531","title":"Poesia Desnudo Poster","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/poesia_desnudo_poster.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"406","title":"Poesia Bandera Mock2 Copia","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/POESIA-BANDERA-MOCK2-copia.jpg","width":"2000","height":"1500","type":"image","video":null},{"id":"376","title":"P Bandera01","url":"https:\/\/www.soonintokyo.com\/media\/_medium\/p_bandera01.jpg","width":"2000","height":"1500","type":"image","video":null}],"text":"<p>2017 was the 100th anniversary of the birth of the poet Palau i Fabre. To honor him, we chose one of his most emblematic and intimate verses of poetry \u201cJo em donaria a qui em volgu\u00e9s\u201d (which roughly translates to \"I would give myself to whoever would have me\") and photographed a series of nude people claiming this verse with a giant flag to show that poetry is not prejudiced when it comes to gender, race, body type, or social class. <\/p>\nThe summer festival Poesia i +, organized by the Fundaci\u00f3 Palau, hosts recitals, concerts, and activities that aim to vindicate the power of words and poetry. Through the title \u201c+ POESIA SI US PLAU\u201d (more poetry please), the festival claims a vindictive and transgressive vision of society. A slogan that demands for more poetry in the world.<p> <\/p>","format":null,"externalUrl":null,"contents":[]},{"title":"Ad. Destornillador","id":"98","slug":"this-space-for-rent-5","type":"ad","orientation":1,"verticalFlow":true,"project":null,"media":[],"text":null,"format":"LANDSCAPE","externalUrl":"","contents":[{"type":"image","url":"https:\/\/www.soonintokyo.com\/media\/_800xAUTO_crop_center-center_none\/destornillador.png","title":"Destornillador"},{"type":"text","text":"Official IBA cocktail:<br \/>\nOne part vodka. Two parts orange juice. No bullshit."}]},{"title":"IMAGINARY VISITORS. LOST&FOUND MAR
