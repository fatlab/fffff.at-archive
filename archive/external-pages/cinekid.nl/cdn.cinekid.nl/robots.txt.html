<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 100vh;
            width: 100vw;
            padding: 0;
            margin: 0;
            background-color: #0a3d3a;
            color: #fff;
            font-family: sans-serif;
            font-optical-sizing: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center
        }

        h1 {
            font-weight: 400;
            font-style: normal;
            font-size: 2rem;
        }

        p {
            font-weight: 300;
            font-style: normal;
            font-size: 1.5rem;
        }

        @media screen and (min-width:600px) {
            div {
                max-width: 60%
            }
        }
    </style>
</head>

<body>
    <div>
        <h1>Cloudfront</h1>
        <p>
            We are ready to serve you
        </p>
    </div>
</body>

</html>
