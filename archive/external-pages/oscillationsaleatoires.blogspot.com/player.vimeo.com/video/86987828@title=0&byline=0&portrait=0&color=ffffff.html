<script type="application/ld+json">{"embedUrl":"https://player.vimeo.com/video/86987828?h=9387dbb25e","thumbnailUrl":"https://i.vimeocdn.com/video/464875311-b0f3bcb64932cf22a8b14e8d8531f3e606c864d078c03653c05c87a86a51f67a-d?f=webp","name":"Made In the Neighbourhood (ft. a clothing printer, OpenKnit)","description":"Presently, production outsourcing has become the norm: mass fabrication of goods at low costs improves corporate profit margins but pushes precarious labour conditions due to a race to the bottom in competing developing markets. Production entails long and precise processes before those goods reach our hands, many of which are pervasive in our daily life, and frequently in intimate contact with us, such as textiles. In such a context the market price we pay for goods has not absorbed the externalities created, thus we end up paying far less for them than the real impact they have in society and the environment.\r\n\r\nOpenKnit offers an alternative landscape to this production model. It’s an open-source, low cost (under 550€), digital fabrication tool that affords the user the opportunity to create his own bespoke clothing from digital files. Starting from the raw material, the yarn, and straight to its end use, a garment ready to be worn. Designing and producing clothes digitally and wearing them can now happen in the very same place, rewarding the user with the ability to make decisions regarding creativity and responsibility.\r\n\r\nIn order to increase accessibility to this new tool, a step by step assembly manual is published while the software Knitic allows you to design your customized clothes easily and feed them into the printer, just a few clicks away. Do KnIt Yourself, acts as an open-source clothing platform, a virtual wardrobe that allows users to share clothes, not only with those near you.\r\n\r\nDeeply inspired by the RepRap project, OpenKnit is an ongoing project that waits to evolve organically with/for the community. There’s a long and exciting way full of possibilities to be developed, I can think about many of them, but happily some are still unknown. Join the project http://openknit.org/\r\n\r\nAnimation that shows how an OpenKnit machine works, by Sergi Rubio \u0026 Estel Roman\r\nhttps://vimeo.com/86889648\r\n\r\nKnitic by Mar Canet and Varvara Guljajeva.\r\nhttp://www.knitic.com/\r\n\r\nDo KnIt Yourself by Takahiro Yamaguchi.\r\nhttp://doknityourself.com/\r\n\r\nMusic by Cayucas, Cayuco from their album Bigfoot.\r\nhttps://cayucas.com","duration":"PT177S","uploadDate":"2014-02-18T08:19:13-05:00","@context":"https://schema.org/","@type":"VideoObject"}</script>
