            var Tumblr = Tumblr || {};
            Tumblr.ORIGIN = 'https://noemimondik.tumblr.com/';

            var ask_form = document.getElementById('ask_form');
            var q = document.getElementById('question');
            var ask_button = document.getElementById('ask_button');
            var characters_remaining = document.getElementById('characters_remaining');
            var character_counter = document.getElementById('character_counter');
            var anonymous_cbx = document.getElementById('ask_anonymously');
            var avatar_flipper = document.getElementById('avatar_flipper');
            var tumblelog_name = document.getElementById('tumblelog_name');
            var anonymous_name = document.getElementById('anonymous_name');
            var old_height = 0;
            var iframePadding = 11;
            var submitted = false;

            // NoCaptcha related
            var nocaptchaRequired = !!0;
            var nocaptchaSuccessfull = false;

            /**
             * Cross-browser event binding.
             * http://ejohn.org/projects/flexible-javascript-events/
             * @param {Object} obj Element to attach event to.
             * @param {String} type Type of event.
             * @param {Function} fn Event handler.
             */
            function addEvent(obj, type, fn) {
                if (obj.attachEvent) {
                    obj['e'+type+fn] = fn;
                    obj[type+fn] = function() {
                        obj['e'+type+fn]( window.event);
                    }
                    obj.attachEvent('on'+type, obj[type+fn]);
                } else {
                    obj.addEventListener(type, fn, false);
                }
            }

            /**
             * Cross-browser stop propagation.
             * @param {Event} e The event to stop.
             */
            function stopEvent(e) {
                if (e.stopPropagation) {
                    e.stopPropagation();
                } else {
                    e.cancelBubble = true;
                }

                if (e.stopImmediatePropagation) {
                    e.stopImmediatePropagation();
                }

                if (e.preventDefault) {
                    e.preventDefault();
                } else {
                    e.returnValue = false;
                }
            }

            /**
             * Validate.
             * @param {Event} e Form submit event.
             */
            function validate(e) {
                // Prevent duplicate submission
                if (submitted) {
                    stopEvent(e);
                    return false;
                }

                                    alert('You must be signed in to ask a question.');
                    stopEvent(e);
                    return false;
                            }

            function setSubmitted() {
                submitted = true;
            }

            /**
             * Strip linebreaks.
             * @param {Event} e Key event.
             */
            function linebreaks(e) {
                if (!e) e = window.event;
                var code = e.charCode ? e.charCode : e.keyCode;
                if (code == 13) {
                    stopEvent(e);
                    return false;
                }
            }

            /**
             * Toggle the user.
             * @param {Event} e Key event.
             */
            function toggleUser(e) {
                if(this.checked) {
                    avatar_flipper.className = 'animating';
                    tumblelog_name.style.display = 'none';
                    anonymous_name.style.display = 'block';
                } else {
                    avatar_flipper.className = '';
                    tumblelog_name.style.display = 'block';
                    anonymous_name.style.display = 'none';
                }
            }

            /**
             * Get the element height.
             * @param {DOMNode} el Element to get height of.
             * @return {Number}
             */
            function elementHeight(el) {
                return Math.max(
                    el.clientHeight,
                    el.scrollHeight,
                    el.offsetHeight
                );
            }

            /**
             * Resize height of iframe if necessary, based on either ask box
             * height of ReCaptcha's height
             *
             * Calls out to tumblelog.js with necessary height
             */
            function resizeAskIframe () {
                var height = getHeightForIframe();

                if (old_height !== height) {
                    old_height = height;
                    parent.postMessage('resize_tumblelog_form_iframe;ask_form;' + height, Tumblr.ORIGIN);
                }
            }

            /**
             * Get height that we need iframe to have so that all contents
             * display fully. Either measures Recpatcha, or ask box itself
             * if Recaptcha is hidden or is off-screen
             *
             * @returns {number} height of the iframe
             */
            function getHeightForIframe () {
                var nocaptchaTestHeight = 0;

                if (nocaptchaRequired) {
                    // nocaptchaTest is an absolutely-positioned element that recaptcha adds to the <body> of the
                    // <iframe> to display a grid of photos (PROD-6967)
                    var nocaptchaTest = document.querySelector('body > [style*="position: absolute"][style*="visibility: visible"]');

                    if (nocaptchaTest) {
                        nocaptchaTestHeight = elementHeight(nocaptchaTest) + nocaptchaTest.getBoundingClientRect().top + iframePadding;
                    }
                }

                return Math.max(
                    nocaptchaTestHeight,
                    elementHeight(ask_form) + iframePadding * 2
                );
            }

            // Prevent linebreaks.
            addEvent(document, 'keydown', linebreaks);

            // Flip avatar.
            if(anonymous_cbx) addEvent(anonymous_cbx, 'click', toggleUser);

            if(ask_form) {
                // Validate on submit.
                addEvent(ask_form, 'submit', validate);
                // Set 'submitted' flag
                addEvent(ask_form, 'submit', setSubmitted);

                // Resizing.
                addEvent(window, 'resize', resizeAskIframe);

                if (nocaptchaRequired) {
                    setInterval(resizeAskIframe, 100);
                } else {
                    resizeAskIframe();
                }
            }

            if(q) {


                setInterval(function() {
                    // Strip linebreaks.
                    if (q.value.match(/\n/g)) q.value = q.value.replace(/\n/g, '');

                    // Character limit.
                    if (q.value.length > 500) q.value = q.value.substring(0, 500);

                    if (!ask_button) {
                        return;
                    }
                    // Enable/Disable ask button
                    ask_button.disabled = isAskButtonDisabled(q);

                    var remaining = 500 - q.value.length;
                    characters_remaining.innerHTML = remaining;

                    // Update character counter.
                    if (remaining <= 120) {
                        character_counter.style.display = 'block';
                        if(remaining > 100) {
                            character_counter.style.color = '#444';
                        } else if (remaining > 80 && remaining <= 100) {
                            character_counter.style.color = '#5f3b3e';
                        } else if (remaining > 60 && remaining <= 80) {
                            character_counter.style.color = '#7b3239';
                        } else if (remaining > 40 && remaining <= 60) {
                            character_counter.style.color = '#962a33';
                        } else if (remaining > 20 && remaining <= 40) {
                            character_counter.style.color = '#b2212e';
                        } else {
                            character_counter.style.color = '#cd1828';
                        }
                    } else {
                        character_counter.style.display = 'none';
                    }
                }, 100);
            }

            /**
             * Ask button must be disabled until
             *  - There is actual input in the form
             *  - Recaptcha is successful (if required)
             *  - The form has not been submitted yet
             */
            function isAskButtonDisabled (q) {
                if (nocaptchaRequired && !nocaptchaSuccessfull) {
                    return true;
                }

                if (submitted) {
                    return true;
                }

                return q.value.length <= 0;
            }

            /**
             * Callback on ReCaptcha successfull submission
             */
            function onRecaptchaSuccess () {
                var nocaptchaTest = document.getElementsByClassName('pls-container');

                if (nocaptchaTest.length) {
                    nocaptchaTest[0].parentElement.removeChild(nocaptchaTest[0]);
                }

                nocaptchaSuccessfull = true;
            }
